<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandala Effect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="layout">
      <aside class="panel">
        <div class="title-row">
          <h1>Mandala Effect</h1>
          <button id="share" class="icon-button" type="button" aria-label="Share" title="Copy a link to this design">
            <!-- Fluent UI System Icons: share_24_regular and checkmark_24_regular -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.25 3a.75.75 0 0 1 0 1.5h-3.5c-1.24 0-2.25 1-2.25 2.25v10.5l.01.23a2.25 2.25 0 0 0 2.24 2.02h10.5c1.24 0 2.25-1 2.25-2.25v-2a.75.75 0 0 1 1.5 0v2A3.75 3.75 0 0 1 17.25 21H6.75c-2 0-3.64-1.58-3.75-3.56V6.75A3.75 3.75 0 0 1 6.75 3zm4.69-.93a.8.8 0 0 1 .8.11l7 6a.75.75 0 0 1 .03 1.11l-7 6.75a.75.75 0 0 1-1.27-.54v-2.98a7 7 0 0 0-2.94.77 11.4 11.4 0 0 0-3.69 3.3l-.27.36a.75.75 0 0 1-1.35-.45c0-2.86.69-5.59 2.17-7.63a8 8 0 0 1 6.08-3.34V2.65q.07-.4.44-.58M16 6.25c0 .41-.34.75-.75.75a6.6 6.6 0 0 0-5.62 2.75 10 10 0 0 0-1.72 4.5q1.5-1.56 2.97-2.3a9 9 0 0 1 4.37-.95.75.75 0 0 1 .75.75v1.98l5.13-4.95L16 4.38z"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M4.53 12.97a.75.75 0 0 0-1.06 1.06l4.5 4.5c.3.3.77.3 1.06 0l11-11a.75.75 0 0 0-1.06-1.06L8.5 16.94z"/></svg>
          </button>
        </div>

        <div id="panel-design">
          <button id="shuffle-all" class="wide" type="button">Shuffle everything</button>
          <section>
            <div class="section-head">
              <h2>Lines</h2>
              <button id="shuffle-lines" type="button">Shuffle</button>
            </div>
            <label>Line weight <output id="lineWeight-value"></output>
              <input id="lineWeight" type="range" min="0.5" max="4" step="0.25" />
            </label>
            <label>Border thickness <output id="borderThickness-value"></output>
              <input id="borderThickness" type="range" min="0" max="2" step="0.1" />
            </label>
            <label>Border spacing <output id="borderSpacing-value"></output>
              <input id="borderSpacing" type="range" min="0" step="1" />
            </label>
          </section>

          <section>
            <div class="section-head">
              <h2>Center</h2>
              <button id="shuffle-center" type="button">Shuffle</button>
            </div>
            <label>Design
              <select id="center"></select>
            </label>
            <label class="check"><input id="bindu" type="checkbox" /> Bindu (Sri Yantra center point)</label>
            <div class="pair">
              <label>Wave 1 <output id="chladniN-value"></output>
                <input id="chladniN" type="range" min="1" max="12" step="1" />
              </label>
              <label>Wave 2 <output id="chladniM-value"></output>
                <input id="chladniM" type="range" min="1" max="12" step="1" />
              </label>
            </div>
            <label>Rotations (Cymatics: rotated) <output id="rotations-value"></output>
              <input id="rotations" type="range" min="3" max="24" step="1" />
            </label>
          </section>

          <section>
            <div class="section-head">
              <h2>Rings</h2>
              <button id="shuffle-rings" type="button">Shuffle</button>
            </div>
            <label>Number of rings <output id="ringCount-value"></output>
              <input id="ringCount" type="range" min="1" max="8" step="1" />
            </label>
            <fieldset class="radios">
              <legend>Ring spacing</legend>
              <label class="check"><input type="radio" name="spacing" value="golden" /> Golden ratio</label>
              <label class="check"><input type="radio" name="spacing" value="even" /> Uniform</label>
            </fieldset>
            <div id="ring-rows" class="rings"></div>
          </section>
        </div>

        <section>
          <h2>Export</h2>
          <div class="buttons">
            <button id="export-svg" type="button">Download SVG</button>
            <button id="export-png" type="button">Download PNG</button>
          </div>
          <label class="check"><input id="minDetail" type="checkbox" /> Hide difficult to print details</label>
        </section>
      </aside>

      <div class="canvas" id="mandala"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
